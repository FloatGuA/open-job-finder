# OpenJobFinder 配置 —— 三层模型
#   Layer 1 系统配置  + Layer 3 workflow 运行参数出厂默认  → 本文件（git 跟踪）
#   Layer 2 用户求职偏好画像                              → data/profile.yaml（gitignore）
#   Layer 3 用户"设为默认"保存的覆盖                       → data/user_settings.yaml（gitignore，懒创建）
# 运行参数优先级（后者覆盖前者）：本文件 w1/w2 < user_settings.yaml < API/CLI 本次 override
# 完整说明见 docs/configuration.md

# ===== Layer 1：系统配置（开发者维护，前端基本只读）=====
llm:                          # [W1+W2] 模型与 fallback 链，按 capability 路由
  capabilities:
    fast:
    - type: ollama            # 本地 ollama（快）
      model: qwen3:8b
      base_url: http://localhost:11434
    balanced:                 # 几乎所有业务逻辑走此链（score_job/analyze_intent/generate_reply/
                              # info_pool/resume_blocks文本/resume_tailor/selfcheck），唯一真正被生产代码
                              # 调用的能力档（fast/powerful 无生产调用方，见下）。
                              # 2026-08-12 起改用 DeepSeek（openai_compatible，chat completions，非 agent CLI），
                              # 不留本地 ollama 兜底——用户已有 DeepSeek API、明确不需要本地模型。
                              # 为什么不用 CLI（codex_cli/claude_cli）：两者都是 agent 壳、非纯 chat 补全，
                              # 会把待分类消息当背景素材反问「你想让我干什么」，非 prompt 可修，历史实测全错。
    - type: openai_compatible
      model: deepseek-chat
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
    powerful:
    - type: claude_cli
    - type: anthropic_api
      model: claude-opus-4-8
      api_key_env: ANTHROPIC_API_KEY
    vision:                   # [简历解析] 视觉模型读简历页面图片 → 结构化块库（parse_resume_vision）。
                              # codex_cli 主 + claude_cli 兜底；两者都失败 → 直接报错（不再兜底本地小 VL，
                              # 用户 2026-08-01 定：本地 qwen2.5vl:7b 精度不够、已从链移除并 ollama rm）。
                              # 两个 CLI 都走用户订阅额度（不需 API key、不额外付费），密集中文简历精度
                              # 远超本地小 VL（真机：两 CLI 均把 名字/2 学位/5 项目 全抽对）。codex_cli 原生
                              # `-i` 附图（prompt 必须走 stdin，因 -i 贪婪吞位置参数）；claude_cli 把图落临时
                              # PNG 让 claude 用 Read 读。只有简历视觉解析走此链——W1/W2 频繁调用不用 CLI
                              #（抢主对话配额+慢）。设 ANTHROPIC_API_KEY 后另可加 anthropic_api 走计费 API。
    - type: codex_cli
    - type: claude_cli
  tool_providers:             # null = 用 capability 路由；填 provider 名可覆盖单个工具
    score_job: null           # [W1]
    analyze_intent: null      # [W2]
dashboard:
  port: 8765

# ===== Layer 3：workflow 运行参数出厂默认（前端可覆盖 / 设为默认）=====
w1:                           # 投递流程
  score_threshold: 60         # 低于此分不投递
  max_cards: 0                # 0 = 本次不限处理卡片数
  daily_limit: 150            # 每日投递上限（当前仅用于 stats 显示，pipeline 未接限流）
  dry_run: false              # true = 演练，不真实投递
  headless: true              # 浏览器无头模式
w2:                           # 检查回应流程
  auto_send_adapted_resume: false   # 关：HR 要简历时只给出「建议发哪一份」，实际发 Boss 站内简历（默认）
                                    # 开：优先把该岗位匹配到的那份简历的**已导出 PDF**作为附件发出，
                                    #     没导出过 / 上传失败 → 自动回退站内简历（不会漏发）。
                                    # ⚠️ 附件上传对 Boss 页面的选择器从未真机验证过，首次开启请盯一次。
  max_conversations: 200      # 本次最多处理会话数
  no_response_days: 14        # 会话多少天无新消息 → 打「停滞」软标记(stage=closed)+提醒；不再拒绝 application
  stale_conv_days: 30         # 投递满多少天且无进展(排除面试/offer) → 清理数据(级联删岗位+会话+消息)，重新走流程
  dry_run: false
  headless: true
