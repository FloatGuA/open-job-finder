[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: pure logic, no I/O
    integration: TestClient or real SQLite
    slow: requires browser or real LLM

addopts = -q

filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
omit =
    tests/*
    dashboard/frontend/*
    */site-packages/*
